name: Release Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Python Environment
      run: |
        python3 -m pip install --break-system-packages pillow 2>/dev/null || pip3 install pillow 2>/dev/null || true

    - name: Build Application Bundle
      run: |
        chmod +x Scripts/*.sh
        ./Scripts/build.sh

    - name: Package DMG
      run: |
        ./Scripts/package_dmg.sh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.dmg
          dist/*.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
