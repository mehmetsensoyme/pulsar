name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build 7-Zip Native Engine
      run: |
        chmod +x Scripts/build.sh Scripts/run_tests.sh
        Scripts/build.sh

    - name: Run Automated Stability & Functionality Tests
      run: |
        Scripts/run_tests.sh
