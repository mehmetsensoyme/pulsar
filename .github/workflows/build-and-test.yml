name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Python Environment
      run: |
        python3 -m pip install --break-system-packages pillow 2>/dev/null || pip3 install pillow 2>/dev/null || true

    - name: Build Application Bundle
      run: |
        chmod +x Scripts/*.sh
        ./Scripts/build.sh

    - name: Run Automated Stability & Functionality Tests
      run: |
        ./Scripts/run_tests.sh
